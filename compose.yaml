services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      POSTGRES_DB: inbox_nudge
    volumes:
      - nudge_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nudge -d inbox_nudge']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      DATABASE_URL: postgresql+psycopg://nudge:${POSTGRES_PASSWORD:-local-demo-password}@db/inbox_nudge
      APP_ENV: ${APP_ENV:-development}
      WEB_AUTH_ENABLED: ${WEB_AUTH_ENABLED:-true}
      REQUEST_LIMITS_ENABLED: ${REQUEST_LIMITS_ENABLED:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-this-secret-32chars}
      EXTENSION_ID: ${EXTENSION_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8000/api/auth/google/callback}
      WEB_APP_ORIGIN: ${WEB_APP_ORIGIN:-http://127.0.0.1:5173}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      DELIVERY_WORKER_ENABLED: ${DELIVERY_WORKER_ENABLED:-true}
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
volumes:
  nudge_data:
